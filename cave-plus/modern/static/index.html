<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cave-Plus - Multiplayer Adventure</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <pre class="login-text" id="login-display"><span style="color: #ffff00;">CAVE-PLUS</span> <span style="color: #ffffff;">(C) 2026</span>

<span style="color: #ffff00;">From CAVE</span> <span style="color: #ffffff;">(C)</span> <span style="color: #00ffff;">GJL WOTWECP</span> <span style="color: #ffffff;">1985</span>


<span style="color: #ffffff;">Please enter your name : <span id="name-input" class="cursor">_</span></span></pre>
            </div>
        </div>

        <!-- Game Screen - MODE 7 Layout -->
        <div id="game-screen" class="screen">
            <div class="game-container">
                <!-- Status Area: Rows 0-5 (6 rows) -->
                <div class="status-area">
                    <div id="status-messages"></div>
                </div>

                <!-- Main Game Area: Rows 7-23 (17 rows) -->
                <div class="main-game-area">
                    <div id="message-log"></div>
                </div>

                <!-- Command Input: Row 24 -->
                <div class="command-area">
                    <span class="prompt" id="command-prompt">*</span>
                    <input 
                        type="text" 
                        id="command-input" 
                        autocomplete="off"
                        placeholder=""
                    >
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/game.js"></script>
</body>
</html>
