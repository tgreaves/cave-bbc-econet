<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cave-Plus - Multiplayer Adventure</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- CRT Filter Toggle Button on Bezel -->
        <button id="crt-toggle" class="bezel-button" title="Toggle CRT Filter">
            <span class="button-label">CRT</span>
        </button>
        
        <!-- Sound Toggle Button on Bezel -->
        <button id="sound-toggle" class="bezel-button" title="Toggle Sound">
            <span class="button-label">🔊</span>
        </button>
        
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="terminal-container">
                <pre id="login-display" class="terminal-text"><span class="double-height" style="color: #ffff00;">CAVE-PLUS</span><span style="color: #ffffff;">(C) XOB 1988 </span><span class="double-height" style="color: #ffffff;">Version 1.00</span>

<span class="double-height" style="color: #ffff00;">From CAVE</span><span style="color: #ffffff;">(C) GJL WOTWECP 1985</span>
<span style="color: #ffffff;">Modern (C) Tristan Greaves 2026</span>


<span style="color: #ffffff;">Please enter your name : <span id="name-input" class="cursor">_</span></span></pre>
            </div>
        </div>

        <!-- Game Screen - Status area + scrolling terminal -->
        <div id="game-screen" class="screen">
            <!-- Status area - rows 0-5 (6 rows) -->
            <div class="status-area">
                <pre id="status-messages"></pre>
            </div>
            
            <!-- Main scrolling area - rows 7-23 with inline prompt -->
            <div class="main-game-area">
                <pre id="message-log"><span id="prompt" class="prompt">*</span><span id="command-display" class="command-display"></span><span class="cursor">_</span></pre>
            </div>
            
            <!-- Hidden input for capturing keystrokes -->
            <input type="text" id="command-input" class="hidden-input" autocomplete="off">
        </div>
    </div>

    <script src="/static/js/game.js"></script>
</body>
</html>
