# ============================================================================
# CAVE-PLUS ROOM DATA
# ============================================================================
# Parsed from original BBC Micro room files in cave-plus/original/R/
# 
# This file contains complete room data for the Cave-Plus multiplayer game:
# - Room descriptions
# - Exit connections (north, south, east, west, up, down)
# - Special room annotations (Altar, Bank, Armoury, etc.)
# - Initial object and creature placement from OBJINIT file
# 
# GAME STATISTICS:
#   Total Rooms:     157
#   Items:           15 (Vodka, Stick, Poison, Dagger, Arrow, Medicine, etc.)
#   Creatures:       27 (Dragon, Troll, Spider, Snakes, Author, etc.)
#   Special Rooms:   12 (Altar, Bank, Armoury, Mortuary, etc.)
# 
# KEY LOCATIONS:
#   Room 1:  Main Entrance / Altar - Dragon boss, Staff of Merlin
#   Room 12: Green Room - Light switch
#   Room 19: Mortuary - Where dead creatures go
#   Room 20: Armoury - Defensive items (Ruby, Shield)
#   Room 26: Snake Pit - Multiple snakes
#   Room 30: Demon's Room - Portcullis, leads to torture caves
#   Room 56: Bank - Deposit treasure for points
#   Room 72: Hall of Knowledge - Tutorial area
# 
# ============================================================================

